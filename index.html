        }

<body>

	<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.183.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.1/examples/jsm/",
					"cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",

			}

	<script type="module">

		delete window.XRWebGLBinding; // Comment out this line when running on headset

		// External module imports
		import * as THREE from 'three';
		import { VRButton } from 'three/addons/webxr/VRButton.js';
		import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
		import * as CANNON from 'cannon-es';
        import CannonDebugger from 'cannon-es-debugger';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

		let cannonDebugger;
		let currSelect = false;

		let camera, scene, raycaster, renderer;
		let controller1, controller2;
		let controllerGrip1, controllerGrip2;

		let group; // To hold our grabbable objects
		let kitchen, ingredientShelf, workstation, oven, ticketStation;
		let rollingPin, doughBowl, sauceBowl, cheeseBowl;

		let isDebugVisible = false;

		let score = 0;

		const ORDER_TYPES = [
			{ id: 'pizza', label: 'Cheese Pizza', requiredType: 'bakedPizza' }
		];
		const TICKET_RAIL_MAX = 5;
		const TICKET_SLOT_SPACING = 0.45;
		const TICKET_RAIL_ORIGIN = new THREE.Vector3(1.0, 1.9, -5.8);

		let activeTickets = [];
		let ticketIdCounter = 0;
		let nextTicketTime = 10 + Math.random() * 20;

		const timer = new THREE.Timer();

		let gameTimeRemaining = 600;
		let timerCanvas, timerCtx, timerTexture;
		let scoreCanvas, scoreCtx, scoreTexture;
		const loader = new GLTFLoader();

		const matBounce = new CANNON.Material('bouncy');
		const matFloor = new CANNON.Material('floor');

		const physicsWorld = new CANNON.World();
        physicsWorld.gravity.set(0, -9.82, 0);

		const intersected = [];
		const objects = [];

		init();

		function init() {

			scene = new THREE.Scene();
			scene.background = new THREE.Color(0x505050);

			const debugGroup = new THREE.Group();
			debugGroup.visible = true;
			scene.add(debugGroup);

			cannonDebugger = CannonDebugger(debugGroup, physicsWorld);

			camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
			camera.position.set(0, 2, 3);
			scene.add(camera);

			loader.load('./assets/Kitchen2.glb', (gltf) => {
				kitchen = gltf.scene;

				// 1. Scale the model template  
				kitchen.scale.set(0.5, 0.5, 0.5);

				// 2. Enable Shadows
				kitchen.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				console.log("Kitchen Loaded.");
				scene.add(kitchen);
			}, undefined, (error) => {
				console.log("Kitchen.glb not found. Skipping.");
			});

			// Load furniture
			loadIngredientShelf();
			loadWorkstation();
			loadOven();
			loadTicketStation();

			// Create bowls
			createDoughBowl();
			createSauceBowl();
			createCheeseBowl();

			const wallWidth = 10;
			const wallHeight = 10;
			const wallDepth = 0.5;

			const wallShape1 = new CANNON.Box(new CANNON.Vec3(wallWidth / 2, wallHeight / 2, wallDepth / 2));
			const wallBody1 = new CANNON.Body({
				mass: 0,
				material: matFloor
			});
			
			wallBody1.addShape(wallShape1);
			wallBody1.position.set(0, 1.5, 7.2);
			physicsWorld.addBody(wallBody1);

			const wallShape2 = new CANNON.Box(new CANNON.Vec3(wallWidth / 2, wallHeight / 2, wallDepth / 2));
			const wallBody2 = new CANNON.Body({
				mass: 0,
				material: matFloor
			});
			
			wallBody2.addShape(wallShape2);
			wallBody2.position.set(0, 1.5, -7.2);
			physicsWorld.addBody(wallBody2);

			const wallShape3 = new CANNON.Box(new CANNON.Vec3(wallWidth * 3/4, wallHeight / 2, wallDepth / 2));
			const wallBody3 = new CANNON.Body({
				mass: 0,
				material: matFloor
			});
			
			wallBody3.addShape(wallShape3);
			wallBody3.position.set(-4.75, 1.5, 0);
			wallBody3.quaternion.setFromEuler(0, Math.PI/2, 0);
			physicsWorld.addBody(wallBody3);

			const wallShape4 = new CANNON.Box(new CANNON.Vec3(wallWidth * 3/4, wallHeight / 2, wallDepth / 2));
			const wallBody4 = new CANNON.Body({
				mass: 0,
				material: matFloor
			});
			
			wallBody4.addShape(wallShape4);
			wallBody4.position.set(4.75, 1.5, 0);
			wallBody4.quaternion.setFromEuler(0, Math.PI/2, 0);
			physicsWorld.addBody(wallBody4);

			// Floor
			const floorBody = new CANNON.Body({
				mass: 0, // static
				shape: new CANNON.Plane(),
				material: matFloor
			});
			floorBody.position.set(0, 0.25, 0);
			floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
			physicsWorld.addBody(floorBody);

			// Light
			scene.add(new THREE.HemisphereLight(0xa5a5a5, 0x898989, 3));
			const light = new THREE.RectAreaLight(0xffffff, 1, 10, 15);
			light.position.set(0, 6, 0);
			light.lookAt(0, 0, 0);
			scene.add(light);

			// Interactable Objects Group
			group = new THREE.Group();
			scene.add(group);

			raycaster = new THREE.Raycaster();
			raycaster.far = 2;

			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			renderer.xr.enabled = true;

			document.body.appendChild(renderer.domElement);
			document.body.appendChild(VRButton.createButton(renderer));

			// Load items into the game
			createRollingPin();

			// controllers
			controller1 = renderer.xr.getController(0);
			controller1.addEventListener('selectstart', onSelectStart);
			controller1.addEventListener('selectend', onSelectEnd);
			controller1.addEventListener('squeezestart', onSqueezeStart);
			controller1.userData.prevPosition = new THREE.Vector3();
			controller1.userData.velocity = new THREE.Vector3();
			scene.add(controller1);

			controller2 = renderer.xr.getController(1);
			controller2.addEventListener('selectstart', onSelectStart);
			controller2.addEventListener('selectend', onSelectEnd);
			controller2.addEventListener('squeezestart', onSqueezeStart);
			controller2.userData.prevPosition = new THREE.Vector3();
			controller2.userData.velocity = new THREE.Vector3();
			scene.add(controller2);

			const controllerModelFactory = new XRControllerModelFactory();

			controllerGrip1 = renderer.xr.getControllerGrip(0);
			controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
			scene.add(controllerGrip1);

			controllerGrip2 = renderer.xr.getControllerGrip(1);
			controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
			scene.add(controllerGrip2);

			// Visualize the rays extended from the two controllers
			const lineGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, - 1)]);
			const line = new THREE.Line(lineGeometry);
			line.name = 'line';
			line.scale.z = 1; // Set the laser length to 1 meter

			// Attach a copy of the laser line to both controllers, 
			// so that they point to the -Z direction from the controller's perspectives.
			controller1.add(line.clone());
			controller2.add(line.clone());

			window.addEventListener('resize', onWindowResize, false);

			initHUD();

		}

		let flatDough, tomatoDough, cheeseDough, bakedPizza, cheese, tomato;
		let flatDoughHalfExtents;
		loader.load('./assets/FlattenedDough.glb', (gltf) => {
			flatDough = gltf.scene;

			// 1. Scale the model template  
			flatDough.scale.set(0.25, 0.25, 0.25);

			// 2. Enable Shadows
			flatDough.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
				}
			});
			console.log("Flat Dough Loaded.");
		}, undefined, (error) => {
			console.log(error);
			console.log("FlattenedDough.glb not found. Skipping.");
		});

		loader.load('./assets/FlattenedDoughSauce.glb', (gltf) => {
			tomatoDough = gltf.scene;

			// 1. Scale the model template  
			tomatoDough.scale.set(0.25, 0.25, 0.25);

			// 2. Enable Shadows
			tomatoDough.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
				}
			});
			console.log("Tomato Dough Loaded.");
		}, undefined, (error) => {
			console.log(error);
			console.log("FlattenedDoughSauce.glb not found. Skipping.");
		});

		loader.load('./assets/FlattenedDoughCheese.glb', (gltf) => {
			cheeseDough = gltf.scene;

			// 1. Scale the model template  
			cheeseDough.scale.set(0.25, 0.25, 0.25);

			// 2. Enable Shadows
			cheeseDough.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
				}
			});
			console.log("Cheese Dough Loaded.");
		}, undefined, (error) => {
			console.log(error);
			console.log("FlattenedDoughCheese.glb not found. Skipping.");
		});

		loader.load('./assets/FlattenedDoughCheeseBaked.glb', (gltf) => {
			bakedPizza = gltf.scene;

			// 1. Scale the model template  
			bakedPizza.scale.set(0.25, 0.25, 0.25);

			// 2. Enable Shadows
			bakedPizza.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
				}
			});
			console.log("Baked Pizza Loaded.");
		}, undefined, (error) => {
			console.log(error);
			console.log("FlattenedDoughCheeseBaked.glb not found. Skipping.");
		});

		loader.load('./assets/ProceduralCheese.glb', (gltf) => {
			cheese = gltf.scene;

			// 1. Scale the model template  
			cheese.scale.set(0.1, 0.1, 0.1);

			// 2. Enable Shadows
			cheese.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
				}
			});

			console.log("Cheese Loaded.");
		}, undefined, (error) => {
			console.log("Cheese.glb not found. Skipping.");
		});

		loader.load('./assets/Tomato.glb', (gltf) => {
			tomato = gltf.scene;

			// 1. Scale the model template  
			tomato.scale.set(0.1, 0.1, 0.1);

			// 2. Enable Shadows
			tomato.traverse((child) => {
				if (child.isMesh) {
					child.castShadow = true;
				}
			});

			console.log("Tomato Loaded.");
		}, undefined, (error) => {
			console.log("Tomato.glb not found. Skipping.");
		});

		function loadIngredientShelf() {
			loader.load('./assets/IngredientShelf.glb', (gltf) => {
				ingredientShelf = gltf.scene;

				// 1. Scale the model template  
				ingredientShelf.scale.set(0.5, 0.5, 0.5);
				const pos = {
					x: 0,
					y: 0.75,
					z: 6
				};
				ingredientShelf.position.set(pos.x, pos.y, pos.z);
				ingredientShelf.rotation.set(0, Math.PI / 2, 0);

				// 2. Enable Shadows
				ingredientShelf.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				// 3. Calculate bounding box of the scaled model
				const box = new THREE.Box3().setFromObject(ingredientShelf);
				const size = new THREE.Vector3();
				box.getSize(size);

				// 4. Store the correct physics extents (half-sizes)
				let halfExtents = new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2);

				const ingredientShelfBody = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(halfExtents),
					material: matBounce
				});
				ingredientShelfBody.position.copy(ingredientShelf.position);
				physicsWorld.addBody(ingredientShelfBody);

				console.log("Ingredient Shelf Loaded.");
				scene.add(ingredientShelf);
			}, undefined, (error) => {
				console.log(error);
				console.log("IngredientShelf.glb not found. Skipping.");
			});
		}

		function loadWorkstation() {
			loader.load('./assets/Workstation.glb', (gltf) => {
				workstation = gltf.scene;

				// 1. Scale the model template  
				workstation.scale.set(0.5, 0.5, 0.5);
				const pos = {
					x: -3.5,
					y: 0.75,
					z: 0
				};
				workstation.position.set(pos.x, pos.y, pos.z);

				// 2. Enable Shadows
				workstation.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				// 3. Calculate bounding box of the scaled model
				const box = new THREE.Box3().setFromObject(workstation);
				const size = new THREE.Vector3();
				box.getSize(size);

				// 4. Store the correct physics extents (half-sizes)
				let halfExtents = new CANNON.Vec3(size.x / 2, size.y / 2 - 0.35, size.z / 2);

				const workstationBody = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(halfExtents),
					material: matBounce
				});
				workstationBody.position.copy(workstation.position);
				physicsWorld.addBody(workstationBody);

				const shelf = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(new CANNON.Vec3(size.x / 8, size.y / 2 - 0.35, size.z / 2)),
					material: matBounce
				});
				shelf.position.set(-4.25, 1.5, 0);
				physicsWorld.addBody(shelf);

				console.log("Workstation Loaded.");
				scene.add(workstation);
			}, undefined, (error) => {
				console.log(error);
				console.log("Workstation.glb not found. Skipping.");
			});
		}

		function loadOven() {
			loader.load('./assets/Oven.glb', (gltf) => {
				oven = gltf.scene;

				// 1. Scale the model template  
				oven.scale.set(0.5, 0.5, 0.5);
				const pos = {
					x: 4,
					y: 0.75,
					z: 0
				};
				oven.position.set(pos.x, pos.y, pos.z);
				oven.rotation.set(0, Math.PI, 0);

				// 2. Enable Shadows
				oven.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				// 3. Calculate bounding box of the scaled model
				const box = new THREE.Box3().setFromObject(oven);
				const size = new THREE.Vector3();
				box.getSize(size);

				// 4. Store the correct physics extents (half-sizes)
				let halfExtents = new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2.4);

				const ovenBody = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(halfExtents),
					material: matBounce
				});
				ovenBody.position.set(4, 0.25, 0.4);
				physicsWorld.addBody(ovenBody);

				const ovenBodyTop = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 3)),
					material: matBounce
				});
				ovenBodyTop.position.set(4, 1.3, 0);
				physicsWorld.addBody(ovenBodyTop);

				const ovenIn = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 12)),
					material: matBounce
				});
				ovenIn.position.set(4, 0.25, -2.1);
				physicsWorld.addBody(ovenIn);

				ovenIn.addEventListener('collide', (event) => {
					const other = event.body;

					if (other.userData && other.userData.type === 'cheeseDough' && !other.userData.transformed) {
						other.userData.transformed = true;

						const doughObj = objects.find(obj => obj.body === other);

						if (doughObj) {
							bake(doughObj);
						}
					}
				});

				console.log("Oven Loaded.");
				scene.add(oven);
			}, undefined, (error) => {
				console.log(error);
				console.log("Oven.glb not found. Skipping.");
			});
		}

		function loadTicketStation() {
			loader.load('./assets/TicketStation.glb', (gltf) => {
				ticketStation = gltf.scene;

				// 1. Scale the model template  
				ticketStation.scale.set(0.5, 0.5, 0.5);
				const pos = {
					x: 0,
					y: 0.75,
					z: -6
				};
				ticketStation.position.set(pos.x, pos.y, pos.z);
				ticketStation.rotation.set(0, -Math.PI/2, 0);

				// 2. Enable Shadows
				ticketStation.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				// 3. Calculate bounding box of the scaled model
				const box = new THREE.Box3().setFromObject(ticketStation);
				const size = new THREE.Vector3();
				box.getSize(size);

				// 4. Store the correct physics extents (half-sizes)
				let halfExtents = new CANNON.Vec3(size.x / 2 - 0.3, size.y / 4 - 0.05, size.z / 2);

				const ticketStationBody = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(halfExtents),
					material: matBounce
				});
				ticketStationBody.position.copy(ticketStation.position);
				physicsWorld.addBody(ticketStationBody);

				ticketStationBody.addEventListener('collide', (event) => {
					const other = event.body;

					if (other.userData && other.userData.type === 'bakedPizza' && !other.userData.removed) {
						other.userData.removed = true;

						const pizzaObj = objects.find(obj => obj.body === other);
						if (pizzaObj) pizzaObj.toRemove = true;

						const ticketIndex = activeTickets.findIndex(t => t.requiredType === 'bakedPizza');
						if (ticketIndex !== -1) {
							const ticket = activeTickets[ticketIndex];
							if (ticket.onHUD) {
								camera.remove(ticket.mesh);
							} else {
								scene.remove(ticket.mesh);
								group.remove(ticket.mesh);
							}

							const removedSlot = ticket.slotIndex;
							activeTickets.splice(ticketIndex, 1);

							if (removedSlot !== null) {
								activeTickets.forEach(t => {
									if (t.onRail && t.slotIndex > removedSlot) t.slotIndex -= 1;
								});
							}
						}

						score += 10;
						updateScoreHUD();
						console.log(`Score +10! Pizza delivered! Current score: ${score}.`);
					}
				});

				const railMesh = new THREE.Mesh(
					new THREE.CylinderGeometry(0.015, 0.015, 2.2, 8),
					new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 })
				);
				railMesh.rotation.z = Math.PI / 2;
				railMesh.position.set(0, 1.95, -5.8);
				scene.add(railMesh);

				console.log("Ticket Station Loaded.");
				scene.add(ticketStation);
			}, undefined, (error) => {
				console.log(error);
				console.log("TicketStation.glb not found. Skipping.");
			});
		}
		
		function getSlotPosition(index) {
			return new THREE.Vector3(
				TICKET_RAIL_ORIGIN.x - index * TICKET_SLOT_SPACING,
				TICKET_RAIL_ORIGIN.y,
				TICKET_RAIL_ORIGIN.z
			);
		}

		function spawnTicket() {
			for (let i = activeTickets.length - 1; i >= 0; i--) {
				const t = activeTickets[i];
				if (t.onRail && t.slotIndex >= TICKET_RAIL_MAX - 1) {
					scene.remove(t.mesh);
					group.remove(t.mesh);
					activeTickets.splice(i, 1);
				}
			}

			activeTickets.forEach(t => {
				if (t.onRail) t.slotIndex += 1;
			});

			const order = ORDER_TYPES[Math.floor(Math.random() * ORDER_TYPES.length)];
			const ticketId = ticketIdCounter++;

			const canvas = document.createElement('canvas');
			canvas.width = 128;
			canvas.height = 192;
			const ctx = canvas.getContext('2d');
			ctx.fillStyle = '#fffef0';
			ctx.fillRect(0, 0, 128, 192);
			ctx.strokeStyle = '#aaa';
			ctx.strokeRect(4, 4, 120, 184);
			ctx.fillStyle = '#333';
			ctx.font = 'bold 20px Courier New';
			ctx.textAlign = 'center';
			ctx.fillText(`#${ticketId + 1}`, 64, 40);
			ctx.font = '15px Courier New';
			ctx.fillText(order.label, 64, 80);

			const texture = new THREE.CanvasTexture(canvas);
			const slotPos = getSlotPosition(0);

			const ticketMesh = new THREE.Mesh(
				new THREE.PlaneGeometry(0.12, 0.18),
				new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
			);
			ticketMesh.position.copy(slotPos);
			ticketMesh.userData.isTicket = true;
			group.add(ticketMesh);

			activeTickets.push({
				ticketId,
				orderId: order.id,
				requiredType: order.requiredType,
				onRail: true,
				onHUD: false,
				slotIndex: 0,
				mesh: ticketMesh,
				spawnTime: timer.getElapsed()
			});
		}

		function ticketSpawnCheck() {
			if (timer.getElapsed() >= nextTicketTime) {
				spawnTicket();
				nextTicketTime = timer.getElapsed() + 5 + Math.random() * 20;
			}
		}

		function snapTicketToHUD(ticket) {
			group.remove(ticket.mesh);

			const removedSlot = ticket.slotIndex;
			ticket.onRail = false;
			ticket.onHUD = true;
			ticket.slotIndex = null;

			if (removedSlot !== null) {
				activeTickets.forEach(t => {
					if (t.onRail && t.slotIndex > removedSlot) t.slotIndex -= 1;
				});
			}

			const hudIndex = activeTickets.filter(t => t.onHUD).length - 1;
			camera.add(ticket.mesh);
			ticket.mesh.position.set(0.28, 0.18 - hudIndex * 0.08, -0.5);
			ticket.mesh.rotation.set(0, 0, 0);
		}

		function makeHUDPlane(planeW, planeH, canvasW, canvasH) {
			const canvas = document.createElement('canvas');
			canvas.width = canvasW;
			canvas.height = canvasH;
			const ctx = canvas.getContext('2d');
			const texture = new THREE.CanvasTexture(canvas);
			const mesh = new THREE.Mesh(
				new THREE.PlaneGeometry(planeW, planeH),
				new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthTest: false })
			);
			mesh.renderOrder = 999;
			return { mesh, canvas, ctx, texture };
		}

		function updateTimerHUD() {
			const mins = Math.floor(gameTimeRemaining / 60);
			const secs = Math.floor(gameTimeRemaining % 60);
			timerCtx.clearRect(0, 0, timerCanvas.width, timerCanvas.height);
			timerCtx.fillStyle = 'rgba(0,0,0,0.6)';
			timerCtx.fillRect(0, 0, timerCanvas.width, timerCanvas.height);
			timerCtx.fillStyle = '#ff6060';
			timerCtx.font = 'bold 32px Courier New';
			timerCtx.textAlign = 'left';
			timerCtx.textBaseline = 'middle';
			timerCtx.fillText(`Time: ${mins}:${secs.toString().padStart(2, '0')}`, 10, timerCanvas.height / 2);

		function createSphere(spawnPoint, sphereColor, objType) {
			const pos = spawnPoint;

			// Visual Sphere
			const radius = 0.1;
			const sphereMesh = new THREE.Mesh(
				new THREE.SphereGeometry(radius, 32, 32),
				new THREE.MeshStandardMaterial({ color: sphereColor })
			);
			sphereMesh.position.set(pos.x, pos.y, pos.z);
			sphereMesh.castShadow = true;
			scene.add(sphereMesh);

			// Physics Body for Sphere
			const sphereBody = new CANNON.Body({
				mass: 1,
				// Need to set to the size of the radius: 0.6 --> radius
				shape: new CANNON.Sphere(radius),
				material: matBounce
			});
			sphereBody.position.copy(sphereMesh.position);
			sphereBody.userData = {type: objType, transformed: false, trashed: false};
			physicsWorld.addBody(sphereBody);

			objects.push({ mesh: sphereMesh, body: sphereBody});
			group.add(sphereMesh);

			if (objType === 'tomato') {
				sphereBody.addEventListener('collide', (event) => {
					const other = event.body;

					if (other.userData && other.userData.type === 'flatDough' && !other.userData.transformed) {
						other.userData.transformed = true;

						const doughObj = objects.find(obj => obj.body === other);

						if (doughObj) {
							addTomato(doughObj);
						}

						if (sphereBody.userData.removed) return;

						sphereBody.userData.removed = true;

						const sphereObj = objects.find(obj => obj.body === sphereBody);
						if (sphereObj) {
							sphereObj.toRemove = true;
						}
					}
				});
			} else if (objType === 'cheese') {
				sphereBody.addEventListener('collide', (event) => {
					const other = event.body;

					if (other.userData && other.userData.type === 'tomatoDough' && !other.userData.transformed) {
						other.userData.transformed = true;

						const doughObj = objects.find(obj => obj.body === other);

						if (doughObj) {
							addCheese(doughObj);
						}

						if (sphereBody.userData.removed) return;

						sphereBody.userData.removed = true;

						const sphereObj = objects.find(obj => obj.body === sphereBody);
						if (sphereObj) {
							sphereObj.toRemove = true;
						}
					}
				});
			}
        }

		function createRollingPin() {
			loader.load('./assets/RollingPin.glb', (gltf) => {
				rollingPin = gltf.scene;

				// 1. Scale the model template  
				rollingPin.scale.set(0.1, 0.1, 0.1);
				rollingPin.position.set(-4.25, 2.05, 1);
				

				// 2. Enable Shadows
				rollingPin.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				const rollingPinMesh = rollingPin.clone();
				rollingPinMesh.castShadow = true;

				const rollingPinBody = new CANNON.Body({
					mass: 1,
					shape: new CANNON.Cylinder(0.05, 0.05, 0.6, 8),
					material: matBounce
				});
				rollingPinBody.position.copy(rollingPin.position);
				rollingPinBody.quaternion.setFromEuler(Math.PI / 2, 0, 0);
				rollingPinBody.userData = { type: 'rollingPin' };
				physicsWorld.addBody(rollingPinBody);

				scene.add(rollingPinMesh);
				objects.push({ mesh: rollingPinMesh, body: rollingPinBody, type: 'rolling pin'});
				group.add(rollingPinMesh);

				rollingPinBody.addEventListener('collide', (event) => {
					const other = event.body;

					if (other.userData && other.userData.type === 'dough' && !other.userData.transformed) {
						other.userData.transformed = true;

						const doughObj = objects.find(obj => obj.body === other);

						if (doughObj) {
							flattenDough(doughObj);
						}
					}
				});

				console.log("Rolling Pin Loaded.");

		function updateControllerVelocity(controller, dt) {
			if (!controller) return;

			const currentPosition = new THREE.Vector3();
			currentPosition.setFromMatrixPosition(controller.matrixWorld);

			const prev = controller.userData.prevPosition;
			const velocity = controller.userData.velocity;

			if (dt > 0) {
				velocity.copy(currentPosition).sub(prev).divideScalar(dt);
			}

			prev.copy(currentPosition);
		}

		function getRootObject(object) {
			while (object.parent && object.parent !== group) {
				object = object.parent;
			}
			return object;
		}

		function onSelectStart(event) {
			const controller = event.target;

			raycaster.setFromXRController(controller);

			const objectIntersections = raycaster.intersectObjects(group.children, true);

			if (objectIntersections.length > 0) {
				const hit = objectIntersections[0].object;
				const object = getRootObject(hit);

				const ticket = activeTickets.find(t => t.mesh === object);
				if (ticket) {
					snapTicketToHUD(ticket);
					return;
				}

				currSelect = true;
				object.traverse(child => {
					if (child.isMesh && child.material && child.material.emissive) {
						child.material.emissive.b = 1;
					}
				});
				controller.attach(object); // Attach to the controller
				controller.userData.selected = object;
			}

		}

		function onSelectEnd(event) {
			const controller = event.target;

			if (controller.userData.selected !== undefined) {
				currSelect = false;
				const object = controller.userData.selected;
				object.traverse(child => {
					if (child.isMesh && child.material && child.material.emissive) {
						child.material.emissive.b = 0;
					}
				});
				group.attach(object); // Attach back to the scene group
				// Re-add physics body
				const physObj = findPhysicsObject(object);
				if (physObj) {
					physObj.body.position.copy(object.position);
					physObj.body.quaternion.copy(object.quaternion);

					// Apply controller velocity
					const velocity = controller.userData.velocity;
					physObj.body.velocity.set(velocity.x, velocity.y, velocity.z);
					physObj.body.angularVelocity.set(0, 0, 0);

					physicsWorld.addBody(physObj.body);
				}
				controller.userData.selected = undefined;
			}
		}

		function onSqueezeStart(event) {
			const controller = event.target;

			let spawnPoint;

            raycaster.setFromXRController(controller);
            const doughIntersects = raycaster.intersectObject(doughBowl);
			const sauceIntersects = raycaster.intersectObject(sauceBowl);
			const cheeseIntersects = raycaster.intersectObject(cheeseBowl);

            if (doughIntersects.length > 0) {
                spawnPoint = { x: 1, y: 1.4, z: 5.3};
				createSphere(spawnPoint, 0xfcf8c8, 'dough');
            }
			if (sauceIntersects.length > 0) {
                spawnPoint = { x: 0, y: 1.4, z: 5.3};
				createTomato(spawnPoint);
            }
			if (cheeseIntersects.length > 0) {
                spawnPoint = { x: -1, y: 1.4, z: 5.3};
				createCheese(spawnPoint);
            }
		}


		function getIntersections(controller) {
			raycaster.setFromXRController(controller);
			return raycaster.intersectObjects(group.children, true);
		}

		function intersectObjects(controller) {
			if (controller.userData.selected !== undefined) return;

			const line = controller.getObjectByName('line');
			const intersections = getIntersections(controller);

			if (intersections.length > 0) {
				const intersection = intersections[0];
				const object = intersection.object;
				if (object.material && object.material.emissive) {
					object.material.emissive.r = 1;
				} else if (object.userData.isTicket) {
					object.material.color.set(0xffdd66);
				}
				intersected.push(object);
				line.scale.z = intersection.distance;
			} else {
				line.scale.z = 5;
			}
		}

		function cleanIntersected() {
			while (intersected.length) {
				const object = intersected.pop();
				if (object.material && object.material.emissive) {
					object.material.emissive.r = 0;
				} else if (object.userData.isTicket) {
					object.material.color.set(0xffffff);
				}
			}
		}

		function removeObjects() {
			for (let i = objects.length - 1; i >= 0; i--) {
				const obj = objects[i];

				if (obj.toRemove) {
					physicsWorld.removeBody(obj.body);
					scene.remove(obj.mesh);
					group.remove(obj.mesh);
					objects.splice(i, 1);
				}
			}
		}

		function animate() {

			cleanIntersected();

			intersectObjects(controller1);
			intersectObjects(controller2);

			ticketSpawnCheck();

			timer.update();
			const dt = timer.getDelta();

			if (gameTimeRemaining > 0) {
				const prevSecs = Math.ceil(gameTimeRemaining);
				gameTimeRemaining = Math.max(0, gameTimeRemaining - dt);
				if (Math.ceil(gameTimeRemaining) !== prevSecs) updateTimerHUD();
			}

            physicsWorld.step(1 / 60, dt, 3);

			activeTickets.forEach(ticket => {
				if (ticket.onRail) {
					ticket.mesh.position.copy(getSlotPosition(ticket.slotIndex));
				}
			});

			removeObjects();

			if (!currSelect) {
				objects.forEach(obj => {
					obj.mesh.position.copy(obj.body.position);
					// Need to sync the quaternion
					obj.mesh.quaternion.copy(obj.body.quaternion);
				});
			}
			if (isDebugVisible) {
                cannonDebugger.update();
            }
			renderer.render(scene, camera);

		}

	</script>
