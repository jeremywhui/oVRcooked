		function init() {

			scene = new THREE.Scene();

			debugGroup.visible = true;
			scene.add(debugGroup);

				// 1. Scale the model template  
				kitchen.scale.set(0.5, 0.5, 0.5);

				// 2. Enable Shadows

					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				console.log("Kitchen Loaded.");
				scene.add(kitchen);
			}, undefined, (error) => {

			});

			// Load furniture

			loadWorkstation();
			loadOven();

			createSauceBowl();
			createCheeseBowl();

			const wallHeight = 10;
			const wallDepth = 0.5;

			const wallShape1 = new CANNON.Box(new CANNON.Vec3(wallWidth / 2, wallHeight / 2, wallDepth / 2));
			const wallBody1 = new CANNON.Body({
				mass: 0,
				material: matFloor
			});
			
			wallBody1.addShape(wallShape1);
			wallBody1.position.set(0, 1.5, 7.2);
			physicsWorld.addBody(wallBody1);

			const wallShape2 = new CANNON.Box(new CANNON.Vec3(wallWidth / 2, wallHeight / 2, wallDepth / 2));
			const wallBody2 = new CANNON.Body({
				mass: 0,
				material: matFloor
			});
			
			wallBody2.addShape(wallShape2);
			wallBody2.position.set(0, 1.5, -7.2);
			physicsWorld.addBody(wallBody2);

			// Floor
			const floorBody = new CANNON.Body({
				mass: 0, // static
				shape: new CANNON.Plane(),
				material: matFloor
			});
			floorBody.position.set(0, 0.25, 0);
			floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
			physicsWorld.addBody(floorBody);

			// Light
			scene.add(new THREE.HemisphereLight(0xa5a5a5, 0x898989, 3));

			light.position.set(0, 6, 0);
			light.lookAt(0, 0, 0);
			scene.add(light);

			// Interactable Objects Group
			group = new THREE.Group();
			scene.add(group);

			raycaster = new THREE.Raycaster();
			raycaster.far = 2;

			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			renderer.xr.enabled = true;

			document.body.appendChild(renderer.domElement);
			document.body.appendChild(VRButton.createButton(renderer));

			// Load items into the game
			createRollingPin();

			// controllers
			controller1 = renderer.xr.getController(0);
			controller1.addEventListener('selectstart', onSelectStart);
			controller1.addEventListener('selectend', onSelectEnd);
			controller1.addEventListener('squeezestart', onSqueezeStart);
			controller1.userData.prevPosition = new THREE.Vector3();
			controller1.userData.velocity = new THREE.Vector3();
			scene.add(controller1);

			controller2 = renderer.xr.getController(1);
			controller2.addEventListener('selectstart', onSelectStart);
			controller2.addEventListener('selectend', onSelectEnd);
			controller2.addEventListener('squeezestart', onSqueezeStart);
			controller2.userData.prevPosition = new THREE.Vector3();
			controller2.userData.velocity = new THREE.Vector3();
			scene.add(controller2);

			const controllerModelFactory = new XRControllerModelFactory();

			controllerGrip1 = renderer.xr.getControllerGrip(0);
			controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
			scene.add(controllerGrip1);

			controllerGrip2 = renderer.xr.getControllerGrip(1);
			controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
			scene.add(controllerGrip2);

			// Visualize the rays extended from the two controllers
			const lineGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, - 1)]);
			const line = new THREE.Line(lineGeometry);
			line.name = 'line';
			line.scale.z = 1; // Set the laser length to 1 meter

			// Attach a copy of the laser line to both controllers, 
			// so that they point to the -Z direction from the controller's perspectives.
			controller1.add(line.clone());
			controller2.add(line.clone());

			window.addEventListener('resize', onWindowResize, false);

		}

		function loadIngredientShelf() {
			loader.load('./models/IngredientShelf.glb', (gltf) => {
				ingredientShelf = gltf.scene;

				// 1. Scale the model template  
				ingredientShelf.scale.set(0.5, 0.5, 0.5);
				const pos = {
					x: 0,
					y: 0.75,
					z: 6
				};
				ingredientShelf.position.set(pos.x, pos.y, pos.z);
				ingredientShelf.rotation.set(0, Math.PI / 2, 0);

				// 2. Enable Shadows
				ingredientShelf.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				// 3. Calculate bounding box of the scaled model
				const box = new THREE.Box3().setFromObject(ingredientShelf);
				const size = new THREE.Vector3();
				box.getSize(size);

				// 4. Store the correct physics extents (half-sizes)
				let halfExtents = new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2);

				const ingredientShelfBody = new CANNON.Body({
					mass: 0,
					shape: new CANNON.Box(halfExtents),
					material: matBounce
				});
				ingredientShelfBody.position.copy(ingredientShelf.position);
				physicsWorld.addBody(ingredientShelfBody);

				console.log("Ingredient Shelf Loaded.");
				scene.add(ingredientShelf);
			}, undefined, (error) => {
				console.log(error);
				console.log("IngredientShelf.glb not found. Skipping.");
			});
		}

		function findPhysicsObject(mesh) {
			return objects.find(obj => obj.mesh === mesh);
		}

		function createSphere(spawnPoint, sphereColor, objType) {
			const pos = spawnPoint;

			// Visual Sphere
			const radius = 0.1;
			const sphereMesh = new THREE.Mesh(
				new THREE.SphereGeometry(radius, 32, 32),
				new THREE.MeshStandardMaterial({ color: sphereColor })
			);
			sphereMesh.position.set(pos.x, pos.y, pos.z);
			sphereMesh.castShadow = true;
			scene.add(sphereMesh);

			// Physics Body for Sphere
			const sphereBody = new CANNON.Body({
				mass: 1,
				// Need to set to the size of the radius: 0.6 --> radius
				shape: new CANNON.Sphere(radius),
				material: matBounce
			});
			sphereBody.position.copy(sphereMesh.position);
			sphereBody.userData = {type: objType, transformed: false, trashed: false};
			physicsWorld.addBody(sphereBody);

			objects.push({ mesh: sphereMesh, body: sphereBody});
			group.add(sphereMesh);
        }

		function replaceSphereWithCylinder(sphereObj) {
			const { mesh, body } = sphereObj;

			// Save transform
			const position = body.position.clone();
			// const quaternion = body.quaternion.clone();

			// Remove old sphere
			physicsWorld.removeBody(body);
			scene.remove(mesh);
			group.remove(mesh);

			// Remove from objects array
			const index = objects.indexOf(sphereObj);
			if (index !== -1) objects.splice(index, 1);

			// ---- Create cylinder mesh ----
			const radius = 0.3;
			const height = 0.05;

			const cylinderMesh = new THREE.Mesh(
				new THREE.CylinderGeometry(radius, radius, height, 32),
				new THREE.MeshStandardMaterial({ color: 0xfcf8c8 })
			);

			cylinderMesh.position.copy(position);
			// cylinderMesh.quaternion.copy(quaternion);
			cylinderMesh.castShadow = true;

			scene.add(cylinderMesh);
			group.add(cylinderMesh);

			// ---- Create cylinder body ----
			const cylinderShape = new CANNON.Cylinder(radius, radius, height, 16);

			const cylinderBody = new CANNON.Body({
				mass: 1,
				material: matBounce
			});

			cylinderBody.addShape(cylinderShape, new CANNON.Vec3());

			cylinderBody.position.copy(position);
			// cylinderBody.quaternion.copy(quaternion);

			physicsWorld.addBody(cylinderBody);

			objects.push({ mesh: cylinderMesh, body: cylinderBody, type: 'cylinder' });
		}

		function createRollingPin() {
			loader.load('./models/RollingPin.glb', (gltf) => {
				rollingPin = gltf.scene;

				// 1. Scale the model template  
				rollingPin.scale.set(0.1, 0.1, 0.1);
				rollingPin.position.set(-4.25, 2.05, 1);
				

				// 2. Enable Shadows
				rollingPin.traverse((child) => {
					if (child.isMesh) {
						child.castShadow = true;
					}
				});

				const rollingPinMesh = rollingPin.clone();
				rollingPinMesh.castShadow = true;

				// 3. Calculate bounding box of the scaled model
				const box = new THREE.Box3().setFromObject(rollingPinMesh);
				const size = new THREE.Vector3();
				box.getSize(size);

				// 4. Store the correct physics extents (half-sizes)
				let rollingPinHalfExtents = new CANNON.Vec3(size.x / 2, size.y / 2, size.z / 2);
				
				scene.add(rollingPinMesh);

				const rollingPinBody = new CANNON.Body({
					mass: 1,
					shape: new CANNON.Box(rollingPinHalfExtents),
					material: matBounce
				});
				rollingPinBody.position.copy(rollingPin.position);
				rollingPinBody.quaternion.copy(rollingPin.quaternion);
				rollingPinBody.userData = { type: 'rollingPin' };
				physicsWorld.addBody(rollingPinBody);

				objects.push({ mesh: rollingPinMesh, body: rollingPinBody});
				group.add(rollingPinMesh);

				rollingPinBody.addEventListener('collide', (event) => {
					const other = event.body;

					if (other.userData && other.userData.type === 'dough' && !other.userData.transformed) {
						other.userData.transformed = true;
						console.log('Rolling pin hit a dough!');

						const sphereObj = objects.find(obj => obj.body === other);

						if (sphereObj) {
							replaceSphereWithCylinder(sphereObj);
						}
					}
				});

				console.log("Rolling Pin Loaded.");
			}, undefined, (error) => {
				console.log(error);
				console.log("RollingPin.glb not found. Skipping.");
			});

		}

		}

		function onWindowResize() {

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);

		}

		function updateControllerVelocity(controller, dt) {
			if (!controller) return;

			const currentPosition = new THREE.Vector3();
			currentPosition.setFromMatrixPosition(controller.matrixWorld);

			const prev = controller.userData.prevPosition;
			const velocity = controller.userData.velocity;

			if (dt > 0) {
				velocity.copy(currentPosition).sub(prev).divideScalar(dt);
			}

			prev.copy(currentPosition);
		}

		function getRootObject(object) {
			while (object.parent && object.parent !== group) {
				object = object.parent;
			}
			return object;
		}

		function onSelectStart(event) {
			const controller = event.target;

			raycaster.setFromXRController(controller);

			const objectIntersections = raycaster.intersectObjects(group.children, true);

			if (objectIntersections.length > 0) {
				currSelect = true;
				const hit = objectIntersections[0].object;
				const object = getRootObject(hit);
				console.log(object);
				object.traverse(child => {
					if (child.isMesh && child.material && child.material.emissive) {
						child.material.emissive.b = 1;
					}
				});
				controller.attach(object); // Attach to the controller
				controller.userData.selected = object;
			}

		}

		function onSelectEnd(event) {
			const controller = event.target;

			if (controller.userData.selected !== undefined) {
				currSelect = false;
				const object = controller.userData.selected;
				object.traverse(child => {
					if (child.isMesh && child.material && child.material.emissive) {
						child.material.emissive.b = 0;
					}
				});
				group.attach(object); // Attach back to the scene group
				// Re-add physics body
				const physObj = findPhysicsObject(object);
				if (physObj) {
					physObj.body.position.copy(object.position);
					physObj.body.quaternion.copy(object.quaternion);

					// Apply controller velocity
					const velocity = controller.userData.velocity;
					physObj.body.velocity.set(velocity.x, velocity.y, velocity.z);
					physObj.body.angularVelocity.set(0, 0, 0);

					physicsWorld.addBody(physObj.body);
				}
				controller.userData.selected = undefined;
			}
		}

		function onSqueezeStart(event) {
			const controller = event.target;

			let spawnPoint;

            raycaster.setFromXRController(controller);
            const doughIntersects = raycaster.intersectObject(doughBowl);
			const sauceIntersects = raycaster.intersectObject(sauceBowl);
			const cheeseIntersects = raycaster.intersectObject(cheeseBowl);

            if (doughIntersects.length > 0) {
                spawnPoint = { x: 1, y: 1.4, z: 5.1};
				createSphere(spawnPoint, 0xfcf8c8, 'dough');
            }
			if (sauceIntersects.length > 0) {
                spawnPoint = { x: 0, y: 1.4, z: 5.1};
				createSphere(spawnPoint, 0xeb4034, 'tomato');
            }
			if (cheeseIntersects.length > 0) {
                spawnPoint = { x: -1, y: 1.4, z: 5.1};
				createSphere(spawnPoint, 0xf7ca14, 'cheese');
            }
		}


		function getIntersections(controller) {
			raycaster.setFromXRController(controller);
			return raycaster.intersectObjects(group.children, true);
		}

		function intersectObjects(controller) {
			if (controller.userData.selected !== undefined) return;

			const line = controller.getObjectByName('line');
			const intersections = getIntersections(controller);

			if (intersections.length > 0) {
				const intersection = intersections[0];
				const object = intersection.object;
				object.material.emissive.r = 1; // Highlight red
				intersected.push(object);
				line.scale.z = intersection.distance;
			} else {
				line.scale.z = 5;
			}
		}

		function cleanIntersected() {
			while (intersected.length) {
				const object = intersected.pop();
				object.material.emissive.r = 0;
			}
		}

		function animate() {

			cleanIntersected();

			intersectObjects(controller1);
			intersectObjects(controller2);

			const dt = clock.getDelta();

            physicsWorld.step(1 / 60, dt, 3);

			if (!currSelect) {
				objects.forEach(obj => {
					obj.mesh.position.copy(obj.body.position);
					// Need to sync the quaternion
					obj.mesh.quaternion.copy(obj.body.quaternion);
				});
			}
			if (isDebugVisible) {
                cannonDebugger.update();
            }
			renderer.render(scene, camera);

		}

	</script>
